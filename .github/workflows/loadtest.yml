# The load-test kit end to end on the runner, in its default mode (this
# repository alone, PKI_MODE=own): a deployment with two engines, 20 virtual
# devices over mTLS for a minute, the report. Checks that the kit works, not
# capacity. Runs when the kit, the server or the compose files change.
name: Load test kit
on:
  pull_request:
    paths: ['loadtest/**', 'engine/**', 'api/**', 'mqtt/**', 'pki/**', 'docker-compose.yml', '.github/workflows/loadtest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deployment (LT_MODE=own)
        run: loadtest/server-up.sh
      - name: 20 devices for a minute
        run: N=20 CONN_RATE=20 loadtest/gen-run.sh smoke ci-smoke
      - name: Check the run
        run: |
          r=results/ci-smoke
          cat "$r/report.md"
          python3 - "$r/fleetgen.json" <<'PY'
          import json, sys
          fg = json.load(open(sys.argv[1]))
          c = fg.get("counts", {})
          started = c.get("session.started", 0)
          timeouts = sum(v for k, v in c.items() if k.startswith("v2g.timeout."))
          failed = sum(v for k, v in c.items() if k.startswith("v2g.failed_code."))
          print(f"sessions {started}, V2G timeouts {timeouts}, FAILED codes {failed}")
          sys.exit(0 if started > 0 and timeouts == 0 and failed == 0 else 1)
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose -p imatra-lt logs --no-color --tail 200
