# Broker of one deployment (13.11.2026, OSS scope, block A).
#
# Two listeners with their own authentication (per_listener_settings true):
#   8883  devices: TLS with a client certificate of the deployment's CA, the
#         certificate's CN is the user name (= device id), ACL dev/<id>/# only;
#         no passwords. Published on the host.
#   1883  the deployment's own services (engine, relay, projector): password account
#         "server", compose network only, never published.
# A certificate whose CN is "server" gets nothing on 8883: that account
# exists on 1883 only. CN "layer" is the service layer: it may write the
# device registry (registry/#) and nothing else (mqtt-run.sh).

per_listener_settings true

# Scale (10.11.2026). Messages queued for a
# client that is behind (an engine on a load peak) or offline: the default
# 1 000 dropped telemetry at 5 000 devices (load test 08.11.2026); the cap
# protects memory, 0 bytes = no byte limit, the count decides.
max_queued_messages 50000
max_queued_bytes 0
# Keepalive a client may ask for at most (telemetry profile: 30-300 s).
max_keepalive 300
# Broker counters under $SYS every 10 s (connections, messages, drops).
sys_interval 10

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Devices: MQTT over TLS with a client certificate (task A3).
# ca.crt: the CA of this deployment only — the root the service layer keeps for
# this cloud (PKI_MODE=layer), or the deployment's own CA (PKI_MODE=own). A
# certificate of another cloud fails the TLS handshake.
listener 8883
protocol mqtt
cafile /pki/ca.crt
certfile /pki/broker.crt
keyfile /pki/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/auth/acl-devices

# The deployment's services on the compose network only. Never published.
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl-services

# More listeners (an operator's own needs, a test setup): *.conf files mounted here.
include_dir /mosquitto/conf.d
